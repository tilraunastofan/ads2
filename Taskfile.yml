version: "3"

tasks:
  theme:
    desc: Regenerate assets/css/arion-theme.css from tokens/tokens.json (fails if a contrast requirement is missed)
    cmds:
      - go run ./cmd/gentheme

  templ:
    desc: templ watcher with live-reload proxy on :7331
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:8090" --cmd="go run ./cmd/showcase" --open-browser=false

  tailwind:
    desc: Tailwind v4 standalone CLI in watch mode
    cmds:
      - tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --watch

  scripts:
    desc: Rebuild the shadcn-templ component JS bundle on change
    cmds:
      - go tool shadcn-templ bundle --watch

  dev:
    desc: Everything for local development (open http://localhost:7331)
    env:
      SHADCN_TEMPL_DEV: "true"
    cmds:
      # The script watcher writes the committed bundle unminified (same file
      # name); put the minified one back when dev stops, Ctrl-C included.
      - defer: { task: clean }
      - task --parallel tailwind scripts templ

  clean:
    desc: Put back the committed build files a dev session rewrote (the minified script bundle)
    cmds:
      - go tool shadcn-templ bundle

  build:
    desc: Production build to bin/showcase
    cmds:
      - go run ./cmd/gentheme
      - go tool templ generate
      - go tool shadcn-templ bundle
      - tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --minify
      - go build -o bin/showcase ./cmd/showcase

  check:
    desc: CI check — tokens meet contrast, generated code is committed, everything builds and passes
    cmds:
      - go run ./cmd/gentheme -check
      - go tool templ generate
      # Rebuild the bundle minified, so a committed dev (unminified) bundle shows
      # as changed below instead of shipping to every app.
      - go tool shadcn-templ bundle
      # git status, not git diff: a new .templ whose _templ.go was never committed
      # shows as untracked, which git diff ignores, and a fresh clone wouldn't build.
      - |
        out=$(git status --porcelain -- '*_templ.go' components/scripts_bundle.go 'assets/js/shadcn-templ-*.js')
        if [ -n "$out" ]; then
          echo "Generated code is not committed (?? = new file, M = changed):"
          echo "$out"
          git --no-pager diff -- '*_templ.go' components/scripts_bundle.go 'assets/js/shadcn-templ-*.js'
          exit 1
        fi
      - go vet ./...
      - go build ./...
      - go test -race ./...
